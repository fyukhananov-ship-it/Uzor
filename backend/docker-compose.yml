# Локальные зависимости backend: Postgres + Redis.
# Сам backend запускается отдельно через uvicorn — это упрощает iter-цикл,
# не нужно пересобирать docker-образ при каждом изменении кода.
#
# Поднять:    docker compose up -d
# Остановить: docker compose down
# Сбросить:   docker compose down -v   (удаляет тома, БД пересоздастся)

services:
  postgres:
    image: postgres:16-alpine
    container_name: uzor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: uzor
      POSTGRES_PASSWORD: uzor
      POSTGRES_DB: uzor
    ports:
      - "5432:5432"
    volumes:
      - uzor-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uzor"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: uzor-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - uzor-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  uzor-postgres-data:
  uzor-redis-data:
